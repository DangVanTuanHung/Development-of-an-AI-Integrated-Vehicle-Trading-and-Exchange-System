services:
  # =====================================================
  # PostgreSQL Database
  # =====================================================
  postgres:
    image: postgres:16-alpine
    container_name: ebike-postgres
    environment:
      POSTGRES_USER: ebike_user
      POSTGRES_PASSWORD: ebike_password_123
      POSTGRES_DB: vehicle_marketplace
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      # Mount SQL init scripts
      - ./sql-init/01-init-extensions.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql:ro
      # Persist PostgreSQL data
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ebike-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebike_user -d vehicle_marketplace"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c log_statement=all
      -c log_duration=on
      -c max_connections=200

  # =====================================================
  # Redis Cache
  # =====================================================
  redis:
    image: redis:7-alpine
    container_name: ebike-redis
    environment:
      REDIS_PASSWORD: redis_password_123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ebike-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password_123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_password_123

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: vehicle-marketplace-minio
    environment:
      MINIO_ROOT_USER: marketplace_admin
      MINIO_ROOT_PASSWORD: marketplace_local_password_123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - ebike-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =====================================================
  # Spring Boot Backend
  # =====================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        - VCS_REF=$(git rev-parse --short HEAD)
        - VERSION=1.0.0
    container_name: ebike-backend
    environment:
      # ========== Database ==========
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vehicle_marketplace
      SPRING_DATASOURCE_USERNAME: ebike_user
      SPRING_DATASOURCE_PASSWORD: ebike_password_123
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 20
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 5
      
      # ========== JPA/Hibernate ==========
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQL14Dialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
      
      # ========== Flyway ==========
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"
      SPRING_FLYWAY_OUT_OF_ORDER: "true"
      
      # ========== Redis Cache ==========
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: redis_password_123
      SPRING_REDIS_TIMEOUT: 2000
      SPRING_CACHE_TYPE: redis
      SPRING_CACHE_REDIS_TIME_TO_LIVE: 3600000
      
      # ========== Application ==========
      SERVER_PORT: 8080
      SERVER_SERVLET_CONTEXT_PATH: /api/v1
      SERVER_COMPRESSION_ENABLED: "true"
      
      # ========== JWT Security ==========
      APP_JWT_SECRET: your-secret-key-here-minimum-256-bits-required-for-security
      APP_JWT_EXPIRATION: 86400000
      APP_JWT_REFRESH_EXPIRATION: 604800000
      
      # ========== Logging ==========
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_EBIKE: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: DEBUG
      LOGGING_PATTERN_CONSOLE: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
      
      # ========== ML Models Path ==========
      ML_MODELS_PATH: /app/ml-models
      BERT_MODEL_PATH: /app/ml-models/intent-classifier.pkl
      NER_MODEL_PATH: /app/ml-models/entity-extractor.pkl
      
      # ========== Environment ==========
      SPRING_PROFILES_ACTIVE: dev
      ENVIRONMENT: development
      GEMINI_AI_ENABLED: "true"
      GEMINI_AI_KEY: ${GEMINI_AI_KEY:-}
      GEMINI_AI_MODEL: ${GEMINI_AI_MODEL:-gemini-3.6-flash}
      GEMINI_CONNECT_TIMEOUT_MS: ${GEMINI_CONNECT_TIMEOUT_MS:-2500}
      GEMINI_READ_TIMEOUT_MS: ${GEMINI_READ_TIMEOUT_MS:-8000}
      GEMINI_VISION_READ_TIMEOUT_MS: ${GEMINI_VISION_READ_TIMEOUT_MS:-45000}
      GEMINI_MAX_ATTEMPTS: ${GEMINI_MAX_ATTEMPTS:-1}
      GEMINI_RETRY_DELAY_MS: ${GEMINI_RETRY_DELAY_MS:-0}
      APP_STORAGE_S3_ENDPOINT: http://minio:9000
      APP_STORAGE_S3_ACCESS_KEY: marketplace_admin
      APP_STORAGE_S3_SECRET_KEY: marketplace_local_password_123
      APP_STORAGE_S3_BUCKET: vehicle-marketplace
      APP_STORAGE_S3_REGION: us-east-1
      APP_STORAGE_S3_PUBLIC_BASE_URL: http://localhost:9000/vehicle-marketplace
      APP_STORAGE_S3_PATH_STYLE_ACCESS: "true"
      APP_STORAGE_S3_INITIALIZE_BUCKET: "false"
      APP_MARKETPLACE_STORAGE_ROOT: /app/uploads/marketplace
      APP_MARKETPLACE_STORAGE_MAX_IMAGE_BYTES: 10485760
    
    ports:
      - "8080:8080"
      - "5005:5005"
    
    volumes:
      - ./src:/app/src
      - ./pom.xml:/app/pom.xml
      - ./src/main/resources/ml-models:/app/ml-models:ro
      - ./src/main/resources/faq-data:/app/faq-data:ro
      - ./logs:/app/logs
      - marketplace_uploads:/app/uploads
    
    networks:
      - ebike-network
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    restart: unless-stopped
    
    stdin_open: true
    tty: true

# =====================================================
# Volumes
# =====================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
  marketplace_uploads:
    driver: local

# =====================================================
# Networks
# =====================================================
networks:
  ebike-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
